[project]
name = "vaibhav-api"
version = "0.1.0"
description = "VAIBHAV matrimony API (FastAPI modular monolith)"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "asyncmy>=0.2.18",
    "cryptography>=50.0.2",
    "email-validator>=2.4.0",
    "fastapi>=0.163.1",
    "phonenumbers>=9.0.43",
    "pydantic-settings>=2.16.3",
    "pyjwt>=2.15.1",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.9",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "SIM", "RUF"]
ignore = ["S101", "B008", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["asyncmy.*", "phonenumbers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
